const viewFromHash = () => { let h = location.hash.replace("#", "");
  if (h === "data-checks") h = "data-quality";
  if (h === "about-me" || h === "architecture") h = "welcome";
  return VIEWS.some(v => v.id === h) ? h : "welcome"; };
const SECTIONS = [
  { id: "overview", label: "Overview", views: ["portfolio", "portfolio-map", "forecast"] },
  { id: "tools", label: "Tools", views: ["simulator", "ask", "sales-marketing", "morning-check"] },
  { id: "reports", label: "Reports", views: ["owner-update", "board-report"] },
  { id: "data", label: "Data quality", views: ["data-quality"] }
];
const sectionOf = v => SECTIONS.find(x => x.views.includes(v)) || SECTIONS[0];

function App() {
  const [view, setView] = useState(viewFromHash());
  const [roleId, setRoleId] = useState("exec");
  const [open, setOpen] = useState(null);
  const [focus, setFocus] = useState(null);
  const [trail, setTrail] = useState([]);
  const prevRef = useRef(view);
  const navigate = (nv, fromBack = false) => {
    if (!VIEWS.some(v => v.id === nv) || nv === prevRef.current) return;
    if (!fromBack) { const pv = prevRef.current; setTrail(t => [...t, pv]); }
    prevRef.current = nv; setView(nv);
    try { history.replaceState(null, "", "#" + nv); } catch (e) {}
    window.scrollTo({ top: 0 });
  };
  useEffect(() => {
    const f = () => navigate(viewFromHash());
    window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f);
  }, []);
  const goBack = () => { if (!trail.length) return; const last = trail[trail.length - 1]; setTrail(t => t.slice(0, -1)); navigate(last, true); };
  const role = ROLES.find(r => r.id === roleId);
  const hotels = ENRICHED.filter(role.test);
  const go = (v, id) => { if (v === "portfolio") setOpen(id); if (v === "simulator" || v === "owner-update" || v === "sales-marketing") setFocus(id); navigate(v); };
  const behind = hotels.filter(h => h.st === "behind");
  const stake = hotels.filter(h => h.monthGap < 0).reduce((s, h) => s + h.monthGap, 0);
  const headline = hotels.length === 1
    ? `${hotels[0].name} is ${hotels[0].st === "behind" ? "behind" : hotels[0].st === "ahead" ? "ahead of" : "on track with"} budget in October.`
    : behind.length ? `${behind.length} of ${hotels.length} hotels are behind budget in October.` : `All ${hotels.length} hotels are on track or ahead of budget in October.`;
  const Current = VIEWS.find(v => v.id === view).C;
  const onWelcome = view === "welcome";
  const curSec = sectionOf(view);
  const tt = portfolioTotals(hotels);
  const [tourStep, setTourStep] = useState(null);
  const goTour = i => { setTourStep(i); navigate(TOUR[i].view, true); };
  const startTour = () => goTour(0);
  const endTour = () => setTourStep(null);
  return html`<div className=${"wrap" + (tourStep !== null ? " touring" : "")}>
    <header className="top">
      <div className="brand"><button type="button" className="brandlink" onClick=${() => navigate("welcome")}>Hotel Portfolio Insights</button>
        <small>A prototype by Sahithi Muppavaram. <button type="button" className="linkbtn" onClick=${() => navigate("welcome")}>About me</button></small></div>
      ${onWelcome ? html`<button type="button" className="primary" onClick=${startTour}>Take the tour</button>`
        : html`<div className="role"><label htmlFor="role">Viewing as</label>
        <select id="role" value=${roleId} onChange=${e => { setRoleId(e.target.value); setOpen(null); setFocus(null); }}>
          ${ROLES.map(r => html`<option key=${r.id} value=${r.id}>${r.label}</option>`)}
        </select></div>`}
    </header>
    ${!onWelcome && html`<div className="hero">
      <h1>${headline}</h1>
      <p>${stake < 0 ? html`<span className="stake">${money(-stake)}</span>` : "No"} room revenue below budget this month${stake < 0 ? ", across the hotels in your view." : "."}</p>
      <div className="kstrip">
        <div><span>Occupancy</span><b>${pct(tt.occ, 1)}</b><small>Budget ${pct(tt.bOcc, 1)}</small></div>
        <div><span>Average rate</span><b>$${tt.adr.toFixed(0)}</b><small>Budget $${tt.bAdr.toFixed(0)}</small></div>
        <div><span>RevPAR</span><b>$${tt.revpar.toFixed(0)}</b><small>Budget $${tt.bRevpar.toFixed(0)}</small></div>
        <div><span>Room revenue vs budget</span><b className=${tt.rev - tt.bRev < 0 ? "stake" : "ok"}>${(tt.rev - tt.bRev >= 0 ? "+" : "") + money(tt.rev - tt.bRev)}</b><small>October 2026</small></div>
      </div>
    </div>`}
    ${!onWelcome && trail.length > 0 && html`<button type="button" className="backbtn" onClick=${goBack}>← Back to ${VIEWS.find(v => v.id === trail[trail.length - 1]).label}</button>`}
    ${!onWelcome && html`<div className="sections" role="group" aria-label="Sections">
      ${SECTIONS.map(x => html`<button key=${x.id} type="button" aria-pressed=${curSec.id === x.id} onClick=${() => navigate(x.views[0])}>${x.label}</button>`)}
    </div>`}
    ${!onWelcome && curSec.views.length > 1 && html`<nav className="tabs" aria-label=${curSec.label + " views"}>
      ${curSec.views.map(id => VIEWS.find(v => v.id === id)).map(v => html`<a key=${v.id} href=${"#" + v.id} aria-current=${view === v.id ? "page" : undefined} onClick=${e => { e.preventDefault(); navigate(v.id); }}>${v.label}</a>`)}
    </nav>`}
    <${Current} key=${view + roleId} hotels=${hotels} open=${open} setOpen=${setOpen} focus=${focus} setFocus=${setFocus} go=${go} roleLabel=${role.label} headline=${headline} stake=${stake} navTo=${navigate} startTour=${startTour} />
    ${tourStep !== null && html`<${TourCard} step=${tourStep} setStep=${goTour} end=${endTour} />`}
    <footer><strong>Disclaimer:</strong> Hotel names are from Pyramid Global Hospitality’s portfolio. All numbers are made up for this demo and are not actual hotel results.</footer>
  </div>`;
}
