<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hotel Portfolio Insights, a prototype by Sahithi Muppavaram</title>

<style>
:root {
  --bg: #F3F6F6; --surface: #FFFFFF; --ink: #1F2A33; --muted: #5B6B74; --line: #D9E1E3;
  --brass: #8C6A22; --ahead: #1F6F6B; --behind: #B4413C; --watch: #9A6512;
  --ahead-soft: #DCEEEC; --behind-soft: #F6E1DF; --watch-soft: #F5EAD6;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181C; --surface: #1A2227; --ink: #E6ECEE; --muted: #9AABB3; --line: #2C373D;
    --brass: #D2B06A; --ahead: #5BC0B8; --behind: #E8857E; --watch: #E2B260;
    --ahead-soft: #18332F; --behind-soft: #3A2220; --watch-soft: #352A16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181C; --surface: #1A2227; --ink: #E6ECEE; --muted: #9AABB3; --line: #2C373D;
  --brass: #D2B06A; --ahead: #5BC0B8; --behind: #E8857E; --watch: #E2B260;
  --ahead-soft: #18332F; --behind-soft: #3A2220; --watch-soft: #352A16;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.brand { font-weight: 700; font-size: 1.05rem; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.role label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
select, input[type=text] {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; min-width: 260px; max-width: 100%;
}
.hero { padding: 32px 0 8px; }
.hero h1 { font-family: "Spectral", Georgia, serif; font-weight: 600; font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.15; margin: 0 0 10px; max-width: 26ch; }
.hero p { margin: 0; color: var(--muted); max-width: 70ch; }
.stake { color: var(--behind); font-weight: 600; }
.rls { margin-top: 12px; font-size: 0.85rem; color: var(--muted); border-left: 3px solid var(--brass); padding-left: 10px; max-width: 70ch; }
.sections { display: flex; gap: 6px; margin: 24px 0 0; overflow-x: auto; padding-bottom: 2px; }
.sections button { font: inherit; font-size: 0.92rem; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; white-space: nowrap; }
.sections button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sections + section, .sections + div > section { margin-top: 20px; }
.kstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.kstrip span { display: block; font-size: 0.8rem; color: var(--muted); }
.kstrip b { display: block; font-family: "Spectral", Georgia, serif; font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kstrip b.ok { color: var(--ahead); }
.kstrip small { font-size: 0.78rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; margin: 12px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { color: var(--muted); text-decoration: none; padding: 10px 14px; border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brass); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.intro { color: var(--muted); margin: 0 0 16px; max-width: 75ch; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.rowbtn {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: minmax(170px, 1.6fr) repeat(3, minmax(70px, 0.7fr)) minmax(160px, 1.6fr);
  gap: 12px; align-items: center; padding: 12px 16px;
}
.rowbtn:hover { background: color-mix(in srgb, var(--bg) 60%, transparent); }
.head { display: grid; grid-template-columns: minmax(170px, 1.6fr) repeat(3, minmax(70px, 0.7fr)) minmax(160px, 1.6fr); gap: 12px; padding: 10px 16px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.hname { font-family: "Spectral", Georgia, serif; font-size: 1.05rem; font-weight: 600; }
.hmeta { display: block; font-size: 0.8rem; color: var(--muted); font-family: "Public Sans", Arial, sans-serif; font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }
.gap { position: relative; height: 22px; }
.gap .axis { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.gap .bar { position: absolute; top: 4px; height: 14px; border-radius: 2px; }
.gap .val { position: absolute; top: 1px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.detail { padding: 4px 16px 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.detail div { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 0.9rem; }
.detail strong { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill.behind { background: var(--behind-soft); color: var(--behind); }
.pill.ahead { background: var(--ahead-soft); color: var(--ahead); }
.pill.watch { background: var(--watch-soft); color: var(--watch); }
.scroll { overflow-x: auto; }
.scroll > .list { min-width: 760px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.fcard h3 { font-family: "Spectral", Georgia, serif; font-size: 1.05rem; margin: 0; }
.fcard .sub { font-size: 0.8rem; color: var(--muted); }

.fline { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.why { margin: 8px 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted); }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.askform { display: flex; gap: 8px; flex-wrap: wrap; }
.askform input { flex: 1 1 280px; }
button.primary { font: inherit; font-weight: 600; background: var(--ink); color: var(--surface); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chips button { font: inherit; font-size: 0.85rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.answer { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.answer .q { font-weight: 600; margin: 0 0 6px; }
.answer ul { margin: 8px 0; padding-left: 20px; }
.sources { font-size: 0.8rem; color: var(--muted); }
.note { margin-top: 14px; font-size: 0.82rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chiprow button { font: inherit; font-size: 0.85rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chiprow button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toolbar select { min-width: 0; }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--brass); text-decoration: underline; cursor: pointer; }
.flag { margin-left: 6px; }
.sim { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.panel h3 { margin: 0 0 12px; font-family: "Spectral", Georgia, serif; font-size: 1.1rem; }
.ctl { margin-bottom: 16px; }
.ctl label { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
.ctl input[type=range] { width: 100%; accent-color: var(--brass); }
.ctl .hint { font-size: 0.8rem; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
.check input { margin-top: 4px; accent-color: var(--brass); }
.big { font-family: "Spectral", Georgia, serif; font-size: 2rem; font-weight: 600; line-height: 1.1; }
.cmp { margin: 14px 0; display: grid; gap: 8px; }
.cmp .lbl { display: flex; justify-content: space-between; font-size: 0.85rem; }
.cmp .track { height: 12px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.cmp .fill { height: 100%; border-radius: 3px; transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .cmp .fill { transition: none; } }
.reset { font: inherit; font-size: 0.85rem; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.dq { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.dq th, .dq td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.dq th { font-size: 0.8rem; color: var(--muted); font-weight: 500; border-top: 0; }
.ok { color: var(--ahead); font-weight: 600; }
.bad { color: var(--behind); font-weight: 600; }
.summary { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 14px; }
.summary div { font-size: 0.85rem; color: var(--muted); }
.summary b { display: block; font-size: 1.4rem; color: var(--ink); font-family: "Spectral", Georgia, serif; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 100px 1fr; gap: 12px; align-items: start; border-top: 1px solid var(--line); padding-top: 10px; }
.steps li .pill { text-align: center; }
.steps b { font-size: 0.95rem; font-weight: 600; }
.steps p { margin: 2px 0 0; font-size: 0.9rem; color: var(--muted); }
.pill.kind { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.brief { margin-top: 16px; border-left: 4px solid var(--brass); }
.brief ul { padding-left: 20px; }
button.primary:disabled { opacity: .6; cursor: default; }
.layers { display: grid; gap: 10px; }
.layer { display: grid; grid-template-columns: 160px 1fr 220px; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; align-items: start; position: relative; }
.layer + .layer::before { content: ""; position: absolute; left: 40px; top: -11px; width: 2px; height: 10px; background: var(--brass); }
.ltitle { font-family: "Spectral", Georgia, serif; font-weight: 600; font-size: 1.05rem; }
.lwhat { font-size: 0.92rem; }
.lproto { font-size: 0.85rem; color: var(--muted); }
.lproto span { display: block; font-size: 0.78rem; color: var(--brass); font-weight: 600; }

.mail, .teams { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mhead { border-bottom: 1px solid var(--line); padding: 12px 16px; font-size: 0.9rem; display: grid; gap: 4px; }
.mhead span { display: inline-block; width: 70px; color: var(--muted); }
.mbody { padding: 16px; max-width: 72ch; }
.mbody p, .tcard p { margin: 0 0 12px; }
.mtable { margin: 4px 0 12px; max-width: 460px; }
.teams { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 16px; }
.tavatar { width: 36px; height: 36px; border-radius: 50%; background: #5B5FC7; color: #fff; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; }
.tmeta { font-size: 0.85rem; margin-bottom: 6px; }
.tmeta span { color: var(--muted); margin-left: 6px; }
.tcard { border: 1px solid var(--line); border-left: 4px solid #5B5FC7; border-radius: 6px; padding: 12px 14px; max-width: 72ch; background: var(--bg); }
.ttitle { font-weight: 700; margin-bottom: 8px; }
.outlook .obar { display: flex; gap: 14px; align-items: center; background: #0F6CBD; color: #fff; padding: 8px 14px; font-size: 0.85rem; }
.osend { background: #fff; color: #0F6CBD; font-weight: 700; border-radius: 4px; padding: 3px 12px; }
.editbox { width: 100%; min-height: 320px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--brass); border-radius: 6px; padding: 10px; line-height: 1.5; resize: vertical; }
.subjedit { width: 100%; min-width: 0; }
.mhead div { display: flex; align-items: center; }
.mhead div > span { flex: 0 0 70px; }
.edited { white-space: pre-wrap; }
a.reset { text-decoration: none; display: inline-block; }
.backbtn { font: inherit; font-size: 0.9rem; font-weight: 600; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; margin-top: 20px; }
.simsum { font-family: "Spectral", Georgia, serif; font-size: 1.15rem; line-height: 1.4; margin: 0 0 14px; }
.checkrow { display: flex; gap: 10px; align-items: flex-start; }
.infobtn { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: italic 600 0.8rem Georgia, serif; cursor: pointer; padding: 0; margin-top: 2px; }
.infobtn[aria-expanded="true"] { background: var(--ink); color: var(--surface); }
.infobox { margin-top: 10px; background: var(--bg); border-left: 3px solid var(--brass); padding: 10px 12px; font-size: 0.88rem; }
.infobox p { margin: 0 0 8px; }

.aboutme h3 { font-size: 1.5rem; margin-bottom: 8px; }
.aboutme p { margin: 0 0 14px; max-width: 75ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 20px; margin: 0; }
.facts dt { font-size: 0.78rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.facts a, .ccard a { color: var(--ink); }
.sechead { font-family: "Spectral", Georgia, serif; font-size: 1.4rem; margin: 28px 0 12px; }
.contrib { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.ccard { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 8px; padding: 14px 16px; }
.ccard h3 { font-family: "Spectral", Georgia, serif; font-size: 1.1rem; margin: 0 0 8px; }
.ccard p { margin: 0 0 8px; font-size: 0.9rem; }
.ccard b { font-weight: 600; }
.brandlink { all: unset; cursor: pointer; font-weight: 700; font-size: 1.05rem; }
.brandlink:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.brand small .linkbtn { font-size: inherit; }
.whero { padding: 40px 0 32px; border-bottom: 1px solid var(--line); }

.whero p { font-size: 1.08rem; color: var(--muted); max-width: 62ch; margin: 0 0 14px; }
.whero .wlive { color: var(--ink); font-family: "Spectral", Georgia, serif; font-size: 1.2rem; border-left: 3px solid var(--brass); padding-left: 12px; margin: 18px 0 24px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }

.wrap.touring { padding-bottom: 240px; }
.welcome .whi { padding: 44px 0 30px; border-bottom: 1px solid var(--line); }

.welcome .whi p { font-size: 1.1rem; color: var(--muted); max-width: 58ch; margin: 0 0 22px; }
.welcome .primary { padding: 10px 20px; font-size: 0.95rem; }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: center; }
@media (max-width: 760px) { .desk { grid-template-columns: 1fr; } }
.keycard { position: relative; aspect-ratio: 1.586; max-width: 360px; border-radius: 14px; padding: 16px 18px; background: linear-gradient(150deg, #23313B 0%, #1A242B 60%, #2B2416 100%); color: #F3F6F6; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: 0 14px 30px -12px rgba(0,0,0,.45); transform: rotate(-3deg); margin: 8px 0 0 6px; }
.ktop { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; position: relative; z-index: 1; }
.ktap { width: 22px; height: 22px; color: #E5CB8F; }
.kstripe { position: absolute; left: 0; right: 0; top: 34%; height: 30px; background: #111A20; border-top: 1px solid #3A4750; border-bottom: 1px solid #3A4750; }
.kbottom { display: flex; flex-direction: column; position: relative; z-index: 1; }
.klabel { font-size: 0.75rem; color: #E5CB8F; font-weight: 600; }
.kname { font-family: "Spectral", Georgia, serif; font-size: 1.4rem; font-weight: 600; line-height: 1.15; }
.kcap { font-size: 0.82rem; color: var(--muted); margin: 14px 0 0; }
.kbio { margin: 0 0 14px; max-width: 60ch; }
.kfacts { display: grid; gap: 8px; margin: 0; }

.kfacts dd { margin: 0; overflow-wrap: anywhere; }
.kfacts a { color: var(--ink); }
.deskh { font-family: "Spectral", Georgia, serif; font-size: 1.2rem; margin: 0 0 10px; }

.elabel { font-size: 0.78rem; font-weight: 700; }

  riverwalk: { days: 31, loaded: "Nov 1, 6:05 AM", issue: "ADR on October 9 was 4 times the usual level, likely a data entry error. That day is held for review." },
  capeverde: { days: 31, loaded: "Oct 30, 11:40 PM", stale: true, issue: "Last load was 2 days ago. The nightly feed did not run on October 31." }
};
const checksFor = h => { const d = DATA_CHECKS[h.id] || { days: 31, loaded: "Nov 1, 6:00 AM" };
  return { ...d, complete: d.days === 31, fresh: !d.stale, valid: h.id !== "riverwalk" }; };

const ROLES = [
  { id: "exec", label: "Executive, all hotels", test: () => true },
  { id: "rvp-west", label: "Regional VP, West", test: h => h.region === "West" },
  { id: "gm-harborline", label: "General manager, Chatham Bars Inn", test: h => h.id === "harborline" },
  { id: "owner-gulfwind", label: "Owner, Naples Grande Beach Resort", test: h => h.id === "gulfwind" }
];

// ---------- Calculations ----------
function status(gapPct) { return gapPct <= -0.03 ? "behind" : gapPct >= 0.03 ? "ahead" : "watch"; }
const STATUS_LABEL = { behind: "Behind budget", ahead: "Ahead of budget", watch: "On track" };
const FSTATUS_LABEL = { behind: "At risk", ahead: "Likely ahead", watch: "Likely on track" };

const ENRICHED = HOTELS.map(h => {
  const revpar = h.occ * h.adr, bRevpar = h.bOcc * h.bAdr;
  const gap = revpar - bRevpar, gapPct = gap / bRevpar;
  const occEffect = (h.occ - h.bOcc) * h.bAdr;     // RevPAR change from selling more or fewer rooms
  const rateEffect = h.occ * (h.adr - h.bAdr);      // RevPAR change from charging more or less
  const monthGap = gap * h.rooms * DAYS_OCT;
  const nf = NOV_FACTOR[h.region];
  const fRevpar = revpar * nf * (1 + h.pace * 0.6);
  const fBudget = bRevpar * nf;
  const fGapPct = fRevpar / fBudget - 1;
  const fMonthGap = (fRevpar - fBudget) * h.rooms * DAYS_NOV;
  const history = SEASON[h.region].map(s => revpar * s);
  return { ...h, revpar, bRevpar, gap, gapPct, occEffect, rateEffect, monthGap, st: status(gapPct),
           nf, fRevpar, fBudget, fGapPct, fMonthGap, fst: status(fGapPct), history };
});

const money = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
const pct = (n, d = 0) => (n * 100).toFixed(d) + "%";
const signedPct = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n * 100).toFixed(d) + "%";

function mainDriver(h) {
  if (h.gap >= 0) return "Running ahead of budget.";
  const occ = Math.abs(Math.min(h.occEffect, 0)), rate = Math.abs(Math.min(h.rateEffect, 0));
  if (occ >= rate) return `Mostly fewer rooms sold: occupancy ${pct(h.occ)} vs ${pct(h.bOcc)} budget.`;
  return `Mostly lower rates: ADR $${h.adr} vs $${h.bAdr} budget.`;
}

// ---------- Health score for the map ----------
// 50 is neutral. October vs budget and the November outlook move it up or down, and open data checks take points off.
function healthFor(h) {
  const c = checksFor(h);
  const dataOk = c.complete && c.fresh && c.valid;
  const parts = { oct: h.gapPct * 250, nov: h.fGapPct * 150, data: dataOk ? 0 : -8 };
  const score = Math.round(Math.max(0, Math.min(100, 50 + parts.oct + parts.nov + parts.data)));
  const level = score >= 65 ? "ahead" : score >= 40 ? "watch" : "behind";
  return { score, level, parts, dataOk, c };
}
const HEALTH_LABEL = { ahead: "Healthy", watch: "Watch", behind: "At risk" };
const points = n => (n >= 0 ? "+" : "−") + Math.abs(Math.round(n)) + " points";

function storyFor(h) {
  const s1 = `${h.name} is ${signedPct(h.gapPct)} vs its October RevPAR budget, ${h.monthGap >= 0 ? money(h.monthGap) + " above" : money(-h.monthGap) + " below"} plan in room revenue.`;
  const occUp = h.occ >= h.bOcc, rateUp = h.adr >= h.bAdr;
  let s2;
  if (occUp && rateUp) s2 = `Both occupancy at ${pct(h.occ)} and the average rate of $${h.adr} are beating plan.`;
  else if (!occUp && !rateUp) s2 = `Fewer rooms sold, ${pct(h.occ)} vs ${pct(h.bOcc)} planned, and a lower average rate, $${h.adr} vs $${h.bAdr}, are both pulling it down.`;
  else if (!occUp) s2 = `Rates are holding at $${h.adr}, but occupancy of ${pct(h.occ)} is below the ${pct(h.bOcc)} plan.`;
  else s2 = `Occupancy is strong at ${pct(h.occ)}, but the average rate of $${h.adr} is below the $${h.bAdr} plan.`;
  const outlook = h.fst === "behind" ? "November is at risk" : h.fst === "ahead" ? "November looks strong" : "November looks on track";
  const s3 = `${outlook}, with a forecast of ${signedPct(h.fGapPct)} vs budget and bookings ${signedPct(h.pace, 0)} vs last year.`;
  return [s1, s2, s3];
}
const escapeHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Copy text, with a fallback for browsers or frames that block the clipboard API
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
function printPage() {
  try { window.focus(); window.print(); return true; } catch (e) { return false; }
}

// ---------- Components ----------
function GapBar({ v }) {
  const width = Math.min(Math.abs(v) / 0.2, 1) * 50;
  const color = v < -0.03 ? "var(--behind)" : v > 0.03 ? "var(--ahead)" : "var(--watch)";
  const barStyle = v < 0 ? { right: "50%", width: width + "%", background: color } : { left: "50%", width: width + "%", background: color };
  const valStyle = v < 0 ? { left: "calc(50% + 6px)", color } : { right: "calc(50% + 6px)", color };
  return html`<div className="gap" role="img" aria-label=${"RevPAR vs budget " + signedPct(v)}>
    <span className="axis"></span><span className="bar" style=${barStyle}></span>
    <span className="val" style=${valStyle}>${signedPct(v)}</span></div>`;
}

const REGIONS = ["Northeast", "Southeast", "South", "Midwest", "West", "Caribbean"];
const SORTS = {
  gap: { label: "Furthest behind budget first", fn: (a, b) => a.gapPct - b.gapPct },
  stake: { label: "Most revenue below budget first", fn: (a, b) => a.monthGap - b.monthGap },
  name: { label: "Hotel name", fn: (a, b) => a.name.localeCompare(b.name) }
};

function Portfolio({ hotels, open, setOpen, go }) {
  const [region, setRegion] = useState("All");
  const [sort, setSort] = useState("gap");
  const regions = REGIONS.filter(r => hotels.some(h => h.region === r));
  const shown = hotels.filter(h => region === "All" || h.region === region).sort(SORTS[sort].fn);
  return html`<section>
    <p className="intro">October 2026 results compared with each hotel’s RevPAR budget. Select a hotel to see what’s driving the gap.</p>
    <div className="toolbar">
      ${regions.length > 1 ? html`<div className="chiprow" role="group" aria-label="Filter by region">
        ${["All", ...regions].map(r => html`<button key=${r} type="button" aria-pressed=${region === r} onClick=${() => setRegion(r)}>${r}</button>`)}
      </div>` : html`<span></span>`}
      <select aria-label="Sort hotels" value=${sort} onChange=${e => setSort(e.target.value)}>
        ${Object.entries(SORTS).map(([k, v]) => html`<option key=${k} value=${k}>${v.label}</option>`)}
      </select>
    </div>
    <div className="scroll"><div className="list">
      <div className="head"><span>Hotel</span><span>Occupancy</span><span>ADR</span><span>RevPAR</span><span>RevPAR vs budget</span></div>
      ${shown.map(h => { const c = checksFor(h); const flagged = !(c.complete && c.fresh && c.valid);
        return html`<div className="row" key=${h.id}>
        <button className="rowbtn" aria-expanded=${open === h.id} onClick=${() => setOpen(open === h.id ? null : h.id)}>
          <span className="hname">${h.name}${flagged && html`<span className="pill watch flag">Data check</span>`}<span className="hmeta">${h.city}, ${h.rooms} rooms</span></span>
          <span className="num">${pct(h.occ)}</span>
          <span className="num">$${h.adr}</span>
          <span className="num">$${h.revpar.toFixed(0)}</span>
          <${GapBar} v=${h.gapPct} />
        </button>
        ${open === h.id && html`<div className="detail">
          <div><strong>Status</strong><span className=${"pill " + h.st}>${STATUS_LABEL[h.st]}</span></div>
          <div><strong>Planned per night</strong>${Math.round(h.bOcc * h.rooms)} rooms sold at $${h.bAdr}</div>
          <div><strong>Actual per night</strong>${Math.round(h.occ * h.rooms)} rooms sold at $${h.adr}</div>
          <div><strong>${h.occEffect < 0 ? "Lost from empty rooms" : "Gained from extra rooms sold"}</strong>${h.occEffect >= 0 ? "+" : ""}${money(h.occEffect * h.rooms * DAYS_OCT)} this month</div>
          <div><strong>${h.rateEffect < 0 ? "Lost from lower prices" : "Gained from higher prices"}</strong>${h.rateEffect >= 0 ? "+" : ""}${money(h.rateEffect * h.rooms * DAYS_OCT)} this month</div>
          <div><strong>Total vs budget</strong>${h.monthGap >= 0 ? "+" : ""}${money(h.monthGap)} this month</div>
          <div><strong>What’s driving it</strong>${mainDriver(h)}</div>
          ${flagged && html`<div><strong>Data note</strong>${c.issue}</div>`}
          <div><strong>Next step</strong><button type="button" className="linkbtn" onClick=${() => go("simulator", h.id)}>Test a pricing scenario</button> or <button type="button" className="linkbtn" onClick=${() => go("owner-update", h.id)}>write the owner update</button></div>
        </div>`}
      </div>`; })}
      ${shown.length === 0 && html`<p className="intro" style=${{ padding: "16px" }}>No hotels match this filter. Choose All to see every hotel in your view.</p>`}
    </div></div>
  </section>`;
}

// ---------- Portfolio map ----------
function PortfolioMap({ hotels, go }) {
  const mapEl = useRef(null), mapRef = useRef(null), layerRef = useRef(null), fittedRef = useRef(false);
  const ranked = hotels.map(h => ({ h, ...healthFor(h) })).sort((a, b) => a.score - b.score);
  const [sel, setSel] = useState(ranked.length ? ranked[0].h.id : null);
  const [mapOk, setMapOk] = useState(!!window.L);
  const [tilesFailed, setTilesFailed] = useState(false);
  const boundsRef = useRef(null), prevSelRef = useRef(null), evLayerRef = useRef(null);
  const [showEvents, setShowEvents] = useState(false);
  const [selEvent, setSelEvent] = useState(null);
  const [promoOpen, setPromoOpen] = useState(null);
  const [copied, setCopied] = useState("");
  const visibleEvents = EVENTS.filter(e => hotels.some(h => h.id === e.hotel));
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const showAll = () => { const m = mapRef.current, b = boundsRef.current; if (!m || !b) return;
    if (b.length === 1) m.setView(b[0], 9, { animate: !reduceMotion }); else m.flyToBounds(b, { padding: [40, 40], animate: !reduceMotion, duration: 0.8 }); };
  const counts = { ahead: 0, watch: 0, behind: 0 };
  ranked.forEach(r => counts[r.level]++);

  useEffect(() => {
    if (!window.L || !mapEl.current) { setMapOk(false); return; }
    const map = L.map(mapEl.current, { scrollWheelZoom: false });
    const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
    const fail = () => setTilesFailed(true);
    const streets = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { attribution: osm, subdomains: "abcd", maxZoom: 19 }).on("tileerror", fail);
    const satellite = L.layerGroup([
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Imagery &copy; Esri", maxZoom: 19 }),
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
    ]);
    const dark = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { attribution: osm, subdomains: "abcd", maxZoom: 19 });
    streets.addTo(map);
    L.control.layers({ "Map": streets, "Satellite": satellite, "Dark": dark }, null, { position: "topright" }).addTo(map);
    map.on("focus click", () => map.scrollWheelZoom.enable());
    map.on("blur mouseout", () => map.scrollWheelZoom.disable());
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    evLayerRef.current = L.layerGroup().addTo(map);
    setTimeout(() => map.invalidateSize(), 50);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--ink").trim();
    const pts = [];
    ranked.forEach(r => {
      const ll = COORDS[r.h.id]; if (!ll) return;
      pts.push(ll);
      const isSel = r.h.id === sel;
      const icon = L.divIcon({ className: "pinicon", html: `<div class="pin ${r.level}${isSel ? " sel" : ""}"><span>${r.score}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 36], tooltipAnchor: [0, -30] });
      const m = L.marker(ll, { icon, zIndexOffset: isSel ? 1000 : 0, keyboard: true, title: r.h.name, alt: `${r.h.name}, ${HEALTH_LABEL[r.level]}` });
      if (tilesFailed) m.bindTooltip(escapeHtml(r.h.city.split(",")[0]), { permanent: true, direction: "right", offset: [14, 12], className: "maplabel" });
      else m.bindTooltip(escapeHtml(`${r.h.name}: ${HEALTH_LABEL[r.level]}, score ${r.score}`), { direction: "top" });
      m.on("click", () => setSel(r.h.id));
      m.addTo(layer);
    });
    boundsRef.current = pts;
    if (!fittedRef.current && pts.length) {
      if (pts.length === 1) map.setView(pts[0], 9); else map.fitBounds(pts, { padding: [40, 40] });
      fittedRef.current = true;
    } else if (sel && sel !== prevSelRef.current && COORDS[sel]) {
      map.flyTo(COORDS[sel], Math.max(map.getZoom(), 10), { animate: !reduceMotion, duration: 0.9 });
    }
    prevSelRef.current = sel;
  }, [sel, tilesFailed]);

  useEffect(() => {
    const layer = evLayerRef.current;
    if (!mapRef.current || !layer) return;
    layer.clearLayers();
    if (!showEvents) return;
    visibleEvents.forEach(e => {
      const base = COORDS[e.hotel]; if (!base) return;
      const ll = [base[0] + e.off[0], base[1] + e.off[1]];
      const icon = L.divIcon({ className: "evicon", html: `<div class="evdot${selEvent === e.id ? " sel" : ""}"><span>${EVENT_ICON[e.type]}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 13], tooltipAnchor: [0, -16] });
      const m = L.marker(ll, { icon, zIndexOffset: 500, title: e.name, alt: `${e.name}, ${e.dates}` });
      m.bindTooltip(escapeHtml(`${e.name}, ${e.dates}`), { direction: "top" });
      m.on("click", () => { setSel(e.hotel); setSelEvent(e.id); });
      m.addTo(layer);
    });
  }, [showEvents, selEvent, sel]);
  const copyPromo = async p => {
    const ok = await copyText("Subject: " + p.subject + "\n\n" + p.body);
    setCopied(ok ? "Copied" : "Copy isn’t available here. Select the text to copy it.");
    setTimeout(() => setCopied(""), 2500);
  };

  const cur = ranked.find(r => r.h.id === sel);
  const curEvents = cur ? visibleEvents.filter(e => e.hotel === cur.h.id) : [];
  return html`<section>
    <p className="intro">Every hotel in your view, colored by overall health. The score combines October results vs budget, the November outlook, and data checks. Select a hotel to read its story.</p>
    <div className="mapgrid">
      <div>
        <div className="mapbox">
          ${mapOk && html`<div className="maptools"><button type="button" aria-pressed=${showEvents} onClick=${() => { setShowEvents(!showEvents); setSelEvent(null); setPromoOpen(null); }}>${showEvents ? "Hide events" : "Show events"}</button><button type="button" onClick=${showAll}>Show all hotels</button></div>`}

        </div>
        <div className="legend">
          <span><span className="dot ahead"></span>Healthy, ${counts.ahead}</span>
          <span><span className="dot watch"></span>Watch, ${counts.watch}</span>
          <span><span className="dot behind"></span>At risk, ${counts.behind}</span>
          <span>The number on each pin is its health score</span>
        </div>
      </div>
      ${cur && html`<div className="panel story" aria-live="polite">
        <h3>${cur.h.name}</h3>
        <p className="hmeta" style=${{ marginTop: "-8px" }}>${cur.h.city}, ${cur.h.rooms} rooms</p>
        <p><span className="score">${cur.score}<small>of 100</small></span> <span className=${"pill " + cur.level}>${HEALTH_LABEL[cur.level]}</span></p>
        ${storyFor(cur.h).map((s, i) => html`<p key=${i}>${s}</p>`)}
        ${!cur.dataOk && html`<p className="sources">Data note: ${cur.c.issue}</p>`}
        <div className="parts">
          <div><span>October vs budget</span><span className="num">${points(cur.parts.oct)}</span></div>
          <div><span>November outlook</span><span className="num">${points(cur.parts.nov)}</span></div>
          <div><span>Data checks</span><span className="num">${cur.dataOk ? "All passed" : points(cur.parts.data)}</span></div>
        </div>
        ${showEvents && html`<div>
          <h4 className="evsec">Upcoming events nearby</h4>
          ${curEvents.length === 0 ? html`<p className="sources">No sample events near this hotel.</p>` : html`<div className="evlist">
            ${curEvents.map(e => { const p = eventPlan(cur.h, e); const promo = promoFor(cur.h, e);
              return html`<div key=${e.id} className=${"evcard" + (selEvent === e.id ? " sel" : "")}>

                <p className="hmeta">${e.type}, ${e.dates}, about ${e.attendance.toLocaleString("en-US")} people</p>

                <button type="button" className="linkbtn" aria-expanded=${promoOpen === e.id} onClick=${() => { setPromoOpen(promoOpen === e.id ? null : e.id); setSelEvent(e.id); }}>${promoOpen === e.id ? "Hide promo" : "Draft promo email"}</button>
                ${promoOpen === e.id && html`<div className="promo"><b>Subject: ${promo.subject}</b>\n\n${promo.body}</div>

        <div className="storylinks">
          <button type="button" className="linkbtn" style=${{ justifySelf: "start" }} onClick=${() => go("portfolio", cur.h.id)}>See October details</button>
          <button type="button" className="linkbtn" style=${{ justifySelf: "start" }} onClick=${() => go("simulator", cur.h.id)}>Test a pricing scenario</button>
          <button type="button" className="linkbtn" style=${{ justifySelf: "start" }} onClick=${() => go("owner-update", cur.h.id)}>Write the owner update</button>

        </div>
      </div>`}
    </div>
    <h2 className="sechead">Hotels by health, lowest first</h2>
    <div className="hlist" role="group" aria-label="Hotels by health">
      ${ranked.map(r => html`<button key=${r.h.id} type="button" className="hitem" aria-pressed=${r.h.id === sel} onClick=${() => setSel(r.h.id)}>
        <span><b>${r.h.name}</b><span className="hmeta">${r.h.city}</span></span>
        <span><span className=${"pill " + r.level}>${r.score}, ${HEALTH_LABEL[r.level]}</span></span>
      </button>`)}
    </div>
    <p className="note">In this prototype the stories are written from fixed rules using the sample numbers. In production, a language model would write them, with every number locked to the source data.</p>
  </section>`;
}

function Spark({ values, forecast }) {
  const all = [...values, forecast];
  const max = Math.max(...all), min = Math.min(...all);
  const x = i => (i / (all.length - 1)) * 116 + 2;
  const y = v => 44 - ((v - min) / (max - min || 1)) * 40;
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const last = values.length - 1;
  return html`<svg viewBox="0 0 120 48" preserveAspectRatio="none" aria-hidden="true">
    <polyline points=${pts} fill="none" stroke="currentColor" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
    <line x1=${x(last)} y1=${y(values[last])} x2=${x(last + 1)} y2=${y(forecast)} stroke="var(--brass)" strokeWidth="2" strokeDasharray="3 2" vectorEffect="non-scaling-stroke" />
    <circle cx=${x(last + 1)} cy=${y(forecast)} r="2.5" fill="var(--brass)" />
  </svg>`;
}

function Forecast({ hotels, go }) {
  const [onlyRisk, setOnlyRisk] = useState(false);
  const sorted = [...hotels].filter(h => !onlyRisk || h.fst === "behind").sort((a, b) => a.fGapPct - b.fGapPct);
  return html`<section>
    <p className="intro">November 2026 RevPAR forecast for each hotel. The line shows the last 12 months, and the dashed gold segment is the forecast. Each forecast lists the reasons behind it.</p>
    <div className="toolbar"><label className="check"><input type="checkbox" checked=${onlyRisk} onChange=${e => setOnlyRisk(e.target.checked)} /> Show only hotels at risk</label></div>
    <div className="fgrid">
      ${sorted.map(h => html`<article className="fcard" key=${h.id}>
        <div className="fline"><h3>${h.name}</h3><span className=${"pill " + h.fst}>${FSTATUS_LABEL[h.fst]}</span></div>
        <div className="sub">${h.city}</div>
        <${Spark} values=${h.history} forecast=${h.fRevpar} />
        <div className="fline"><span>Forecast RevPAR</span><span className="num">$${h.fRevpar.toFixed(0)} (range $${(h.fRevpar * .94).toFixed(0)} to $${(h.fRevpar * 1.06).toFixed(0)})</span></div>
        <div className="fline"><span>Budget</span><span className="num">$${h.fBudget.toFixed(0)}</span></div>

function buildFeeds(hotels, fixed = []) {
  const feeds = [];
  hotels.forEach(h => SYSTEMS.forEach(s => {

    const score = 100 - failed.length * 20;
    const st = failed.some(c => BLOCKING.includes(c.id)) ? "behind" : failed.length ? "watch" : "ahead";
    feeds.push({ key, h, s, vendor: s.vendor(h), results, failed, score, st, isFixed,
      loaded: f.loaded || "Nov 1, " + s.expected, issue: f.issue, action: f.action, cause: f.cause });
  }));

}

// ----- Missing day example -----
function MissingDay({ hotels }) {
  const h = hotels.find(x => x.id === "gulfwind") || hotels[0];
  const [mode, setMode] = useState("gap");
  const [method, setMethod] = useState("prev");
  const scale = h.rooms / 300;
  const real = [42, 38, 45, 51, 47, 40, 44].map(v => Math.max(1, Math.round(v * scale)));
  const lastWeek = Math.round(real.reduce((a, b) => a + b, 0) * 0.97);
  const est = method === "prev" ? real[0] : Math.round((real[0] + real[2]) / 2);
  const vals = real.map((v, i) => i !== 1 ? v : mode === "gap" ? null : mode === "fill" ? est : v);
  const total = vals.reduce((s, v) => s + (v || 0), 0);
  const vs = total / lastWeek - 1;
  const max = Math.max(...real, est) * 1.15;
  const days = ["Nov 1", "Nov 2", "Nov 3", "Nov 4", "Nov 5", "Nov 6", "Nov 7"];
  const kind = mode === "gap" ? "gap" : mode === "fill" ? "est" : "late";
  const stat = { gap: "Missing", est: "Estimated", late: "Loaded late" }[kind];
  const from = method === "prev" ? "Nov 1" : "the average of Nov 1 and Nov 3";
  const msg = mode === "gap"
    ? `Pickup looks like ${total} rooms, ${signedPct(vs)} vs last week, as if demand fell. But Nov 2 is simply missing. People could draw the wrong conclusion.`
    : mode === "fill"
    ? `Pickup is ${total} rooms, ${signedPct(vs)} vs last week. Nov 2 is a temporary estimate taken from ${from}, and it is labeled everywhere it appears.`
    : `The Nov 2 file arrived late and was loaded into its own date. The estimate of ${est} rooms was replaced with the real ${real[1]}, and pickup was updated to ${total} rooms, ${signedPct(vs)} vs last week.`;
  const steps = [
    ["Spot the gap", "Nov 2 is on the expected calendar, but no file arrived."],
    ["Keep loading", "Nov 3 to 7 load as normal. One missing day does not stop the pipeline."],
    ["Fill and label", `Nov 2 gets a temporary estimate from ${from}, marked Estimated in every report.`],
    ["Ask for the file", "The vendor is asked to resend Nov 2, and the day is tracked until it arrives."],
    ["Load into the right date", "The late file is merged on hotel and date, so nothing is counted twice."],
    ["Update the totals", "Only numbers that include Nov 2 are recalculated, with a note that they changed."]
  ];
  const done = mode === "gap" ? 2 : mode === "fill" ? 4 : 6;
  return html`<div className="panel">
    <p className="intro" style=${{ margin: "0 0 12px" }}>Example: ${h.name}, rooms picked up each day from November 1 to 7. Nov 2’s file never arrived. Sample numbers.</p>
    <div className="toolbar">
      <div className="chiprow" role="group" aria-label="How to show the missing day">
        ${[["gap", "Leave the gap"], ["fill", "Fill the gap"], ["real", "Real data arrives"]].map(([k, l]) => html`<button key=${k} type="button" aria-pressed=${mode === k} onClick=${() => setMode(k)}>${l}</button>`)}
      </div>
      ${mode !== "gap" && html`<select aria-label="How to estimate the missing day" value=${method} onChange=${e => setMethod(e.target.value)}>
        <option value="prev">Estimate from the day before</option>
        <option value="avg">Estimate from the days around it</option>
      </select>`}
    </div>
    <div className="pickup">
      <div className="pbars" role="img" aria-label=${days.map((d, i) => d + " " + (vals[i] == null ? "missing" : vals[i] + " rooms")).join(", ")}>
        ${days.map((d, i) => { const k = i === 1 ? kind : "ok"; const v = vals[i];
          return html`<div className="pcol" key=${d}>
            <div className="pval">${v == null ? "?" : v}</div>
            <div className="ptrack"><div className=${"pbar " + k} style=${{ height: (v == null ? 100 : v / max * 100) + "%" }}></div></div>
            <div className="pday">${d}</div>
            <div className=${"pstat " + k}>${i === 1 ? stat : "Loaded"}</div>
          </div>`; })}
      </div>
      <div className="ptotal">
        <span>7 day pickup</span>
        <b>${total} rooms</b>
        <span className=${"pill " + (mode === "gap" ? "behind" : "ahead")}>${signedPct(vs)} vs last week</span>
        <p className=${mode === "gap" ? "bad" : ""} style=${{ fontWeight: mode === "gap" ? 600 : 400 }}>${msg}</p>
      </div>
    </div>
    <ol className="fixsteps">${steps.map(([t, d], i) => html`<li key=${i} className=${i < done ? "done" : ""}><b>${i < done ? "Done:" : "Waiting:"} ${t}.</b> ${d}</li>`)}</ol>
    <div className="infobox" style=${{ marginTop: "14px" }}>
      <p><b>Which estimate to use:</b> the day before works well for numbers that change slowly, like rooms on the books. For daily activity like pickup, the average of the days around it is often closer. Either way, the estimate is labeled and replaced once the real data arrives.</p>
    </div>
  </div>`;
}

// ----- Data profiling -----
const PROFILE_FIELDS = {
  pms: [{ f: "room_rate", kind: "num", base: h => h.adr, spread: .15, money: true }, { f: "rooms_sold", kind: "num", base: h => h.occ * h.rooms, spread: .1 }, { f: "room_type", kind: "cat", distinct: 6 }],
  booking: [{ f: "booking_id", kind: "id" }, { f: "arrival_date", kind: "date" }, { f: "channel", kind: "cat", distinct: 4 }],
  pos: [{ f: "transaction_id", kind: "id" }, { f: "check_amount", kind: "num", base: () => 62, spread: .4, money: true }, { f: "outlet", kind: "cat", distinct: 5 }],
  labor: [{ f: "employee_id", kind: "id" }, { f: "hours_worked", kind: "num", base: () => 7.6, spread: .12, dec: 1 }, { f: "department", kind: "cat", distinct: 7 }]
};
const ROWS_PER_DAY = { pms: h => h.rooms, booking: h => Math.round(h.rooms * 0.35), pos: h => Math.round(h.rooms * 2.2), labor: h => Math.round(h.rooms * 0.6) };
function profileFor(feed) {
  const sys = feed.s.id, h = feed.h;
  const fail = feed.isFixed ? [] : (FEED_ISSUES[feed.key] || { fail: [] }).fail;
  const typ = ROWS_PER_DAY[sys](h);
  let rows = typ, rowsNote = "Normal";
  if (fail.includes("complete") || (fail.includes("fresh") && feed.key !== "pinehollow:labor")) { rows = 0; rowsNote = "No rows received"; }
  if (fail.includes("dupes")) { rows = typ * 2; rowsNote = "Twice the usual rows"; }
  const fmt = (p, v) => p.money ? "$" + Math.round(v) : p.dec ? v.toFixed(p.dec) : Math.round(v).toLocaleString("en-US");
  const fields = PROFILE_FIELDS[sys].map((p, i) => {
    const missing = rows === 0 ? "No data" : (0.1 + i * 0.1).toFixed(1) + "%";
    if (p.kind === "num") {
      const b = p.base(h), lo = b * (1 - 2 * p.spread), hi = b * (1 + 2 * p.spread);
      let seenHi = hi * 0.96, flag = null;
      if (p.f === "room_rate" && fail.includes("ranges")) { seenHi = b * 4; flag = "Highest value is 4 times the usual"; }
      return { f: p.f, missing, seen: rows === 0 ? "None" : `${fmt(p, lo * 1.04)} to ${fmt(p, seenHi)}`, usual: `${fmt(p, lo)} to ${fmt(p, hi)}`, flag };
    }
    if (p.kind === "id") {
      const dup = fail.includes("dupes");
      return { f: p.f, missing, seen: rows === 0 ? "None" : `${(dup ? rows / 2 : rows).toLocaleString("en-US")} unique of ${rows.toLocaleString("en-US")}`, usual: "Every row unique", flag: dup ? "Repeated IDs" : null };
    }
    if (p.kind === "date") return { f: p.f, missing, seen: rows === 0 ? "None" : "Nov 1 to Mar 28", usual: "Today to 12 months out", flag: null };
    return { f: p.f, missing, seen: rows === 0 ? "None" : `${p.distinct} values`, usual: `${p.distinct} values`, flag: null };
  });
  if (fail.includes("schema")) fields.push({ f: "loyalty_tier", missing: "12.0%", seen: "3 values", usual: "Not seen before", flag: "New column" });
  if (rows === 0) fields.forEach(x => { x.flag = x.flag || "No data"; });
  const flagged = rowsNote !== "Normal" || fields.some(x => x.flag);
  return { typ, rows, rowsNote, fields, flagged, late: fail.includes("fresh") && feed.key === "pinehollow:labor" };
}

function Profiling({ feeds }) {
  const profiles = feeds.map(f => ({ f, p: profileFor(f) }));
  const firstFlag = profiles.find(x => x.p.flagged) || profiles[0];
  const [hid, setHid] = useState(firstFlag ? firstFlag.f.h.id : null);
  const [sid, setSid] = useState(firstFlag ? firstFlag.f.s.id : "pms");

  const hotelsIn = [...new Map(feeds.map(f => [f.h.id, f.h])).values()];
  const cur = profiles.find(x => x.f.h.id === hid && x.f.s.id === sid) || profiles[0];
  const nFlag = profiles.filter(x => x.p.flagged).length;
  return html`<div className="panel">
    <p className="intro" style=${{ margin: "0 0 12px" }}>Profiling studies what each feed normally looks like: how many rows arrive, how many values are missing, and the usual range of each field. Those profiles set the “numbers look normal” checks, so limits are learned, not guessed. ${nFlag} of ${profiles.length} feeds look different from normal today.</p>
    <div className="toolbar">

      <div><b><span className=${"pill " + (cur.p.flagged ? "watch" : "ahead")}>${cur.p.flagged ? "Looks different" : "Normal"}</span></b>${cur.p.rowsNote !== "Normal" ? cur.p.rowsNote : cur.p.late ? "Arrived 6 hours late" : "compared with the last 30 days"}</div>

        <td>${x.flag ? html`<span className="bad">${x.flag}</span>` : html`<span className="ok">Normal</span>`}</td></tr>`)}</tbody>
    </table></div>
  </div>`;
}

function DataQuality({ hotels }) {

    { t: "Alert", d: "The data team is told automatically." },

    { t: "Fix it at the source", d: f.action },
    { t: "Load it again", d: "Load only the affected days into their correct dates. Because the load merges on each record’s ID, nothing is counted twice." },
    { t: "Check again", d: "The same checks run again. If they pass, the real data replaces any estimate." }
  ];

  const vendors = [...new Set(feeds.map(f => f.vendor))].sort().map(v => {
    const vf = feeds.filter(f => f.vendor === v);
    return { v, system: vf[0].s.label, n: vf.length, ok: vf.filter(f => f.st === "ahead").length, onTime: vf.filter(f => f.results.fresh).length };
  });
  const mark = ok => ok ? html`<span className="ok">Yes</span>` : html`<span className="bad">No</span>`;
  const caughtAt = node => node.checks ? feeds.filter(f => f.failed.some(c => node.checks.includes(c.id))) : [];
  const estimated = feeds.filter(f => f.st === "behind");
  const estHotels = [...new Map(estimated.map(f => [f.h.id, f.h])).values()];
  const nodeStat = n => n.id === "vendor" ? `${feeds.length} feeds` : n.checks ? (caughtAt(n).length ? `${caughtAt(n).length} caught` : "All clear")
    : n.id === "gold" ? (estimated.length ? `${estimated.length} filled` : "No gaps") : (estHotels.length ? `${estHotels.length} labeled` : "All real data");
  const node = LINEAGE.find(n => n.id === lin);
  const nodeList = node.checks ? caughtAt(node) : node.id === "gold" ? estimated : [];
  return html`<section>
    <style>${DQ_CSS}</style>
    <p className="intro">Each hotel uses several systems, from different vendors. Every night, the data from each system is checked before anyone uses it. Problem data is never quietly removed: gaps are filled with labeled estimates and replaced when the real data arrives.</p>
    <div className="summary">
      <div><b>${count("ahead")} of ${feeds.length}</b>are good</div>
      <div><b>${count("behind")}</b>filled and labeled</div>
      <div><b>${count("watch")}</b>need a look</div>
    </div>
    ${fixed.length > 0 && html`<p className="note" style=${{ marginTop: 0 }}>${fixed.length} fixed in this demo. <button type="button" className="linkbtn" onClick=${() => setFixed([])}>Reset the demo</button></p>`}
    <div className="panel" style=${{ display: "grid", gap: "8px", fontSize: "0.9rem" }}>
      <div><span className="pill ahead">Good</span> The data is safe to use.</div>
      <div><span className="pill watch">Needs a look</span> A small problem was handled automatically. Someone should still check it.</div>
      <div><span className="pill behind">Filled and labeled</span> Data is missing, late, or wrong. Reports use a temporary estimate marked Estimated, so totals like 7 day pickup don’t look falsely low. The real data replaces it once it’s fixed.</div>
    </div>

    <h2 className="sechead">When a day is missing</h2>
    <${MissingDay} hotels=${hotels} />

    <h2 className="sechead">Where each issue was caught</h2>
    <div className="lineage" role="group" aria-label="Data lineage">
      ${LINEAGE.map((n, i) => html`<${React.Fragment} key=${n.id}>
        ${i > 0 && html`<span className="larrow" aria-hidden="true"></span>`}
        <button type="button" className="lnode" aria-pressed=${lin === n.id} onClick=${() => setLin(n.id)}>
          <b>${n.title}</b><span>${nodeStat(n)}</span>
        </button>
      </${React.Fragment}>`)}
    </div>
    <div className="panel" style=${{ marginTop: "10px" }} aria-live="polite">
      <h3>${node.title}</h3>
      <p style=${{ margin: "0 0 8px" }}>${node.what}</p>
      ${node.checks && html`<p className="sources" style=${{ margin: "0 0 8px" }}>Checks here: ${node.checks.map(c => CHECKS.find(x => x.id === c).label).join(" and ")}.</p>`}
      ${nodeList.length > 0 && html`<ul className="why" style=${{ color: "var(--ink)" }}>${nodeList.map(f => html`<li key=${f.key}><b>${f.h.name}, ${f.s.label}:</b> ${f.issue} ${f.action}</li>`)}</ul>`}
      ${node.id === "reports" && html`<p style=${{ margin: 0 }}>${estHotels.length ? `${names(estHotels)} currently show${estHotels.length === 1 ? "s" : ""} an Estimated label on some days.` : "Every report uses real data right now."}</p>`}
      ${node.checks && nodeList.length === 0 && html`<p className="ok" style=${{ margin: 0 }}>No issues caught at this step.</p>`}
    </div>

    <h2 className="sechead">Every system, every hotel</h2>
    <div className="toolbar">
      <div className="chiprow" role="group" aria-label="Filter by status">
        ${[["all", "All"], ["behind", "Filled"], ["watch", "Needs a look"], ["ahead", "Good"]].map(([k, l]) => html`<button key=${k} type="button" aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${l}</button>`)}
      </div>
      <select aria-label="Filter by system" value=${sys} onChange=${e => setSys(e.target.value)}>
        <option value="all">All systems</option>
        ${SYSTEMS.map(s => html`<option key=${s.id} value=${s.id}>${s.label}</option>`)}
      </select>
    </div>
    <div className="scroll"><div className="list" style=${{ minWidth: "860px" }}>
      <table className="dq">
        <thead><tr><th>Hotel and system</th>${CHECKS.map(c => html`<th key=${c.id}>${c.label}</th>`)}<th>Result</th></tr></thead>
        <tbody>${shown.map(f => html`<${React.Fragment} key=${f.key}>
          <tr style=${f.issue ? { cursor: "pointer" } : null} onClick=${() => f.issue && setOpen(open === f.key ? null : f.key)}>
            <td>${f.issue ? html`<button type="button" className="linkbtn" aria-expanded=${open === f.key}>${f.h.name}</button>` : f.h.name}<span className="hmeta">${f.s.label}, ${f.vendor}${f.isFixed ? ", fixed today" : ""}</span></td>
            ${CHECKS.map(c => html`<td key=${c.id}>${mark(f.results[c.id])}</td>`)}
            <td><span className=${"pill " + f.st}>${FEED_STATUS[f.st]}</span></td>
          </tr>
          ${open === f.key && html`<tr><td colSpan=${CHECKS.length + 2}>
            <div className="detail" style=${{ padding: 0 }}>
              <div><strong>What happened</strong>${f.issue}</div>
              <div><strong>Why</strong>${f.cause}</div>
            </div>
            <ol className="fixsteps">${fixSteps(f).map((x, i) => html`<li key=${i} className=${f.isFixed ? "done" : ""}><b>${x.t}</b> ${x.d}</li>`)}</ol>
            ${f.isFixed
              ? html`<p className="ok" style=${{ margin: "8px 0 0" }}>Fixed. The checks passed, and real data replaced the estimate.</p>`
              : html`<button type="button" className="primary" style=${{ marginTop: "8px" }} onClick=${e => { e.stopPropagation(); setFixed([...fixed, f.key]); }}>Fix and load again</button>`}
          </td></tr>`}
        </${React.Fragment}>`)}</tbody>
      </table>
      ${shown.length === 0 && html`<p className="intro" style=${{ padding: "16px" }}>No feeds match this filter. Choose All to see every feed.</p>`}
    </div></div>
    <p className="note">Click a hotel name to see what went wrong and how it gets fixed.</p>

    <h2 className="sechead">Data profiling</h2>
    <${Profiling} feeds=${feeds} />

    <h2 className="sechead">Which vendor has problems?</h2>
    <div className="scroll"><div className="list" style=${{ minWidth: "560px" }}>
      <table className="dq">
        <thead><tr><th>Vendor</th><th>System</th><th>On time</th><th>Good</th></tr></thead>
        <tbody>${vendors.map(v => html`<tr key=${v.v}>
          <td>${v.v}</td><td>${v.system}</td>
          <td className="num">${v.onTime} of ${v.n} hotels</td>
          <td><span className=${"pill " + (v.ok === v.n ? "ahead" : "watch")}>${v.ok} of ${v.n} hotels</span></td></tr>`)}</tbody>
      </table>
    </div></div>
    <p className="note">If one vendor causes problems at many hotels, one fix with that vendor solves them all.</p>
  </section>`;
}

const QUESTIONS = [
  { id: "behind", q: "Which hotels are behind budget, and why?", keys: ["behind", "why", "under", "miss"],
    answer: hs => { const r = hs.filter(h => h.st === "behind").sort((a, b) => a.gapPct - b.gapPct);
      return { text: r.length ? `${r.length} of ${hs.length} hotels are behind their October RevPAR budget.` : "No hotels in your view are behind budget in October.",
        items: r.map(h => ({ h, t: `${signedPct(h.gapPct)} vs budget, ${money(h.monthGap)} in room revenue. ${mainDriver(h)}` })), rows: r }; } },
  { id: "stake", q: "Where is the most revenue at stake?", keys: ["stake", "revenue", "money", "lost", "loss"],
    answer: hs => { const r = hs.filter(h => h.monthGap < 0).sort((a, b) => a.monthGap - b.monthGap);
      const total = r.reduce((s, h) => s + h.monthGap, 0);
      return { text: r.length ? `${money(-total)} in October room revenue is below budget across ${r.length} hotels.` : "No room revenue is below budget in your view.",
        items: r.map(h => ({ h, t: money(h.monthGap) })), rows: r }; } },
  { id: "nov", q: "Which hotels may miss their November budget?", keys: ["november", "forecast", "next month", "predict", "future"],
    answer: hs => { const r = hs.filter(h => h.fst === "behind").sort((a, b) => a.fGapPct - b.fGapPct);
      return { text: r.length ? `${r.length} hotels are forecast to miss November budget.` : "No hotels in your view are forecast to miss November budget.",
        items: r.map(h => ({ h, t: `forecast ${signedPct(h.fGapPct)} vs budget. Bookings on the books ${signedPct(h.pace, 0)} vs last year.` })), rows: r }; } },
  { id: "best", q: "Which hotels are performing best?", keys: ["best", "top", "ahead", "strong", "good"],
    answer: hs => { const r = hs.filter(h => h.st === "ahead").sort((a, b) => b.gapPct - a.gapPct);
      return { text: r.length ? `${r.length} hotels are ahead of their October budget.` : "No hotels in your view are ahead of budget in October.",
        items: r.map(h => ({ h, t: `${signedPct(h.gapPct)} vs budget, ${money(h.monthGap)} in room revenue.` })), rows: r }; } },
  { id: "trust", q: "Can I trust this month’s numbers?", keys: ["trust", "data", "quality", "accurate", "reliable"],
    answer: hs => { const r = hs.filter(h => { const c = checksFor(h); return !(c.complete && c.fresh && c.valid); });
      return { text: r.length ? `${hs.length - r.length} of ${hs.length} hotels passed every data check. ${r.length} need attention before you rely on them.` : `All ${hs.length} hotels in your view passed every data check.`,
        items: r.map(h => ({ h, t: checksFor(h).issue })), rows: r }; } }
];

function Ask({ hotels, go }) {
  const [text, setText] = useState("");
  const [qid, setQid] = useState(null);
  const [miss, setMiss] = useState(null);
  const q = QUESTIONS.find(x => x.id === qid);
  const result = q ? { q: q.q, ...q.answer(hotels) } : null;
  const flagged = result ? result.rows.filter(h => { const c = checksFor(h); return !(c.complete && c.fresh && c.valid); }) : [];
  const submit = e => {
    e.preventDefault();
    const t = text.toLowerCase().trim();
    if (!t) return;
    const m = QUESTIONS.find(x => x.keys.some(k => t.includes(k)));
    if (m) { setQid(m.id); setMiss(null); } else { setQid(null); setMiss(text); }
  };
  return html`<section>
    <p className="intro">Ask a question about your hotels. Every answer is calculated from the data you’re allowed to see, and lists the hotels it used.</p>
    <div className="ask">
      <form className="askform" onSubmit=${submit}>
        <input type="text" aria-label="Your question" placeholder="For example: which hotels are behind budget?" value=${text} onChange=${e => setText(e.target.value)} />
        <button className="primary" type="submit">Ask</button>
      </form>
      <div className="chips">${QUESTIONS.map(x => html`<button key=${x.id} type="button" onClick=${() => { setText(x.q); setQid(x.id); setMiss(null); }}>${x.q}</button>`)}</div>
      ${miss && html`<div className="answer" aria-live="polite"><p className="q">${miss}</p><p>This prototype answers a few portfolio questions. Try one of the suggestions above.</p></div>`}
      ${result && html`<div className="answer" aria-live="polite">
        <p className="q">${result.q}</p>
        <p>${result.text}</p>
        ${result.items.length > 0 && html`<ul>${result.items.map(({ h, t }) => html`<li key=${h.id}><button type="button" className="linkbtn" onClick=${() => go("portfolio", h.id)}>${h.name}</button>: ${t}</li>`)}</ul>`}
        ${flagged.length > 0 && q.id !== "trust" && html`<p className="sources">Data note: ${flagged.map(h => h.name).join(", ")} ${flagged.length === 1 ? "has" : "have"} an open data check, so treat ${flagged.length === 1 ? "its" : "their"} numbers with care.</p>`}
        ${result.rows.length > 0 && html`<p className="sources">Sources: October 2026 results for ${result.rows.map(h => h.name).join(", ")}.</p>`}
      </div>`}
      <p className="note">In this prototype, answers come from fixed calculations. In production, this would use Azure OpenAI with retrieval over owner reports through Azure AI Search, with answers grounded in sources and evaluated before release.</p>
    </div>
  </section>`;
}

function blockedFor(h) { const c = checksFor(h); return !(c.complete && c.fresh); }
const names = hs => hs.length <= 1 ? hs.map(h => h.name).join("") : hs.length === 2 ? hs[0].name + " and " + hs[1].name : hs.slice(0, -1).map(h => h.name).join(", ") + ", and " + hs[hs.length - 1].name;

function buildRun(hotels) {
  const flagged = hotels.filter(h => { const c = checksFor(h); return !(c.complete && c.fresh && c.valid); });
  const blocked = hotels.filter(blockedFor);
  const usable = hotels;
  const behind = usable.filter(h => h.st === "behind").sort((a, b) => a.monthGap - b.monthGap);
  const risk = usable.filter(h => h.fst === "behind").sort((a, b) => a.fGapPct - b.fGapPct);
  const why = h => h.gap >= 0 ? "" : (Math.abs(Math.min(h.occEffect, 0)) >= Math.abs(Math.min(h.rateEffect, 0))
    ? `${h.name} sold ${pct(h.occ)} of rooms, planned ${pct(h.bOcc)}.`
    : `${h.name} charged $${h.adr} a night, planned $${h.bAdr}.`);
  const steps = [
    { kind: "Look up", name: "Check each hotel’s data", detail: `Checked ${hotels.length} ${hotels.length === 1 ? "hotel" : "hotels"}. ${flagged.length ? flagged.length + (flagged.length === 1 ? " has" : " have") + " data problems." : "No data problems."}` },
    { kind: "Safety rule", name: "Label estimated data", detail: blocked.length ? `${names(blocked)} ${blocked.length === 1 ? "has" : "have"} missing or late data. Those days use labeled estimates instead of being dropped.` : "Every hotel’s data is complete and current." },
    { kind: "Look up", name: "Find hotels behind budget", detail: behind.length ? `${names(behind)} made less than planned in October.` : "No hotels made less than planned in October." },
    { kind: "Look up", name: "Find out why", detail: behind.length ? behind.map(why).join(" ") : "Nothing to explain." },
    { kind: "Look up", name: "Look ahead to November", detail: risk.length ? `${names(risk)} will likely miss November too.` : "No hotels are likely to miss November." },
    { kind: "Safety rule", name: "Double check every number", detail: "Every number in the brief comes from the steps above. Nothing is made up." },
    { kind: "Result", name: "Write the morning brief", detail: "Done." }
  ];
  return { steps, behind, risk, blocked };
}

function MorningCheck({ hotels, go }) {
  const run = buildRun(hotels);
  const [shown, setShown] = useState(0);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running) return;
    if (shown >= run.steps.length) { setRunning(false); return; }
    const t = setTimeout(() => setShown(s => s + 1), 650);
    return () => clearTimeout(t);
  }, [running, shown]);
  const start = () => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setShown(run.steps.length); setRunning(false); } else { setShown(0); setRunning(true); }
  };
  const done = shown >= run.steps.length;
  const top = run.behind[0];
  return html`<section>
    <p className="intro">Every morning, an assistant checks all the hotels and writes leaders a short summary of what needs attention. Press the button to watch it work.</p>
    <div className="panel">
      <div className="toolbar" style=${{ marginBottom: 0 }}>
        <button className="primary" type="button" onClick=${start} disabled=${running}>${running ? "Checking hotels" : done ? "Run again" : "Run morning check"}</button>
        <span style=${{ fontSize: "0.85rem", color: "var(--muted)" }}>Demo using the sample numbers</span>
      </div>
      ${shown > 0 && html`<ol className="steps" aria-live="polite">
        ${run.steps.slice(0, shown).map((s, i) => html`<li key=${i}>
          <span className=${"pill " + (s.kind === "Safety rule" ? "watch" : s.kind === "Result" ? "ahead" : "kind")}>${s.kind}</span>
          <div><b>${i + 1}. ${s.name}</b><p>${s.detail}</p></div></li>`)}
      </ol>`}
    </div>
    ${done && shown > 0 && html`<div className="panel brief" aria-live="polite">
      <h3>Good morning. Here’s today’s summary.</h3>
      <p>${run.behind.length ? `${run.behind.length} ${run.behind.length === 1 ? "hotel needs" : "hotels need"} attention:` : "No hotels need attention today."}</p>
      ${run.behind.length > 0 && html`<ul>${run.behind.map(h => html`<li key=${h.id}><button type="button" className="linkbtn" onClick=${() => go("portfolio", h.id)}>${h.name}</button>: ${money(-h.monthGap)} below budget, mostly from ${Math.abs(Math.min(h.occEffect, 0)) >= Math.abs(Math.min(h.rateEffect, 0)) ? "empty rooms" : "lower prices"}.</li>`)}</ul>`}
      ${run.risk.length > 0 && html`<p>${names(run.risk)} will likely miss November too.</p>`}
      ${top && html`<p><b>Start with ${top.name}.</b> It’s missing the most money. <button type="button" className="linkbtn" onClick=${() => go("simulator", top.id)}>Test a fix</button></p>`}
      ${run.blocked.length > 0 && html`<p className="sources">Includes estimated days for ${names(run.blocked)}. ${run.blocked.length === 1 ? "Its" : "Their"} numbers will update when the real data arrives.</p>`}
    </div>`}
    <p className="note">In a real version, this would run on Azure AI Foundry every morning, and each person would only see the hotels they look after.</p>
  </section>`;
}

function Architecture() {
  return html`<section>
    <p className="intro">Here’s how I’d build this for real, using the tools listed for this role.</p>
    <div className="layers">
      ${LAYERS.map((l, i) => html`<div className="layer" key=${i}>
        <div className="ltitle">${l.title}</div>
        <div className="lwhat">${l.what}</div>
        <div className="lproto"><span>In this prototype</span>${l.proto}</div>
      </div>`)}
    </div>
  </section>`;

function planFor(h) {
  if (h.gap >= 0) return "We’ll protect rates on peak dates while keeping occupancy strong, and look for ways to carry this momentum into November.";
  const occ = Math.abs(Math.min(h.occEffect, 0)), rate = Math.abs(Math.min(h.rateEffect, 0));
  if (occ >= rate) return "Our focus is filling more rooms: more group sales outreach and targeted promotions for our lowest-demand dates, while holding rates where demand is strong.";
  return "Our focus is recovering rate: reviewing pricing on high-demand dates and reducing discounting where demand allows.";
}

function buildUpdate(h, tone) {
  const c = checksFor(h);
  const flagged = !(c.complete && c.fresh && c.valid);
  const roomRev = h.revpar * h.rooms * DAYS_OCT, bRoomRev = h.bRevpar * h.rooms * DAYS_OCT;
  const lines = [];
  lines.push(`October RevPAR was $${h.revpar.toFixed(0)}, ${signedPct(h.gapPct)} vs our budget of $${h.bRevpar.toFixed(0)}. Room revenue was ${money(roomRev)}, ${h.monthGap >= 0 ? "+" : ""}${money(h.monthGap)} vs budget.`);
  lines.push(h.gap >= 0 ? `We ran ahead of plan, with occupancy at ${pct(h.occ)} and an average rate of $${h.adr}.` : mainDriver(h).replace("Mostly fewer rooms sold:", "The gap came mostly from fewer rooms sold, with").replace("Mostly lower rates:", "The gap came mostly from lower rates, with"));
  lines.push(`For November, we expect RevPAR around $${h.fRevpar.toFixed(0)} against a budget of $${h.fBudget.toFixed(0)} (${signedPct(h.fGapPct)}).`);
  lines.push(planFor(h));
  const detail = tone === "detailed" ? {
    table: [
      ["Occupancy", pct(h.occ), pct(h.bOcc)],
      ["ADR", "$" + h.adr, "$" + h.bAdr],
      ["RevPAR", "$" + h.revpar.toFixed(0), "$" + h.bRevpar.toFixed(0)],
      ["Room revenue", money(roomRev), money(bRoomRev)]
    ],
    extra: [
      `Rooms sold changed RevPAR by ${money(h.occEffect)} and room rate by ${money(h.rateEffect)}, per available room.`,
      `November in the ${h.region} usually runs ${signedPct(h.nf - 1, 0)} vs October, and bookings on the books are ${signedPct(h.pace, 0)} vs this time last year.`
    ]
  } : null;
  const note = flagged ? `A note on the data: ${c.issue}` : null;
  const subject = `${h.name}: October 2026 performance update`;
  const plain = ["Subject: " + subject, "", "Hello,", "", ...lines,
    ...(detail ? ["", ...detail.table.map(r => `${r[0]}: ${r[1]} actual, ${r[2]} budget`), "", ...detail.extra] : []),
    ...(note ? ["", note] : []), "", "Best regards,", `General Manager, ${h.name}`].join("\n");
  return { subject, lines, detail, note, plain };
}

// ---------- One click board report ----------
function portfolioTotals(hs) {
  const sum = f => hs.reduce((s, h) => s + f(h), 0);
  const avail = sum(h => h.rooms) * DAYS_OCT;
  const sold = sum(h => h.occ * h.rooms) * DAYS_OCT, bSold = sum(h => h.bOcc * h.rooms) * DAYS_OCT;
  const rev = sum(h => h.revpar * h.rooms) * DAYS_OCT, bRev = sum(h => h.bRevpar * h.rooms) * DAYS_OCT;
  const fRev = sum(h => h.fRevpar * h.rooms) * DAYS_NOV, fBud = sum(h => h.fBudget * h.rooms) * DAYS_NOV;
  return { occ: sold / avail, bOcc: bSold / avail, adr: rev / sold, bAdr: bRev / bSold,
    revpar: rev / avail, bRevpar: bRev / avail, rev, bRev, fRev, fBud };
}
function actionFor(h) {
  const occ = Math.abs(Math.min(h.occEffect, 0)), rate = Math.abs(Math.min(h.rateEffect, 0));
  return occ >= rate
    ? `Fill more rooms at ${h.name}: step up group sales and run targeted promotions on the lowest demand dates.`
    : `Recover rate at ${h.name}: review pricing on high demand dates and cut back discounting.`;
}

function offerFor(h, audience) {
  const strong = h.st === "behind";
  if (audience === "business") return { text: strong ? "15% off weekday stays plus late checkout" : "late checkout and free breakfast on weekday stays", code: strong ? "WORK15" : "WORKPLUS" };
  if (audience === "groups") return { text: strong ? "one free room for every 10 booked, plus free meeting space for a day" : "free meeting space for a day when you book 10 or more rooms", code: strong ? "GROUP10" : "GROUPMEET" };
  return { text: strong ? "save 15% when you stay 2 nights or more" : "free breakfast for two each morning of your stay", code: strong ? "ESCAPE15" : "ESCAPEPLUS" };
}
const joinList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + ", and " + a[a.length - 1];

function buildCampaign(h, periodId, audience, format) {
  const p = PERIODS.find(x => x.id === periodId), feats = FEATURES[h.id] || [], o = offerFor(h, audience);
  const town = h.city.split(",")[0];
  if (format === "social") {
    const opener = audience === "business" ? `Work trip to ${town} ${p.short}?` : audience === "groups" ? `Planning a team or family trip ${p.short}?` : `Your ${town} getaway is calling ${p.short}.`;
    const tag = "#" + h.name.replace(/[^A-Za-z]/g, "");
    return { subject: "", body: `${opener} Enjoy ${joinList(feats)} at ${h.name}. Our offer: ${o.text}. Dates: ${p.when}. Book on our website with code ${o.code}.\n\n${tag} #${town.replace(/[^A-Za-z]/g, "")} #TravelDeals` };
  }
  const subject = audience === "business" ? `Make your next ${town} work trip easier` : audience === "groups" ? `Bring your group to ${h.name} ${p.short}` : `Your ${town} escape ${p.short}`;
  const body = [
    "Hello,", "",
    audience === "business" ? `Traveling to ${town} for work ${p.short}? ${h.name} makes it easy, with ${joinList(feats)} close at hand.`
      : audience === "groups" ? `${h.name} is ready for your next team retreat, reunion, or celebration, with ${joinList(feats)}.`
      : `Slow down and recharge at ${h.name}, with ${joinList(feats)} waiting for you.`, "",
    `For a limited time, ${o.text}.`, `Dates: ${p.when}.`, "",
    `Book on our website or call us, and use code ${o.code}.`, "",
    "We look forward to welcoming you.", `The team at ${h.name}`
  ].join("\n");
  return { subject, body };
}

function TourCard({ step, setStep, end }) {
  const t = TOUR[step];
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.focus(); }, [step]);
  useEffect(() => {
    const k = e => { if (e.key === "Escape") end(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);
  const last = step === TOUR.length - 1;
  return html`<div className="tour" role="dialog" aria-label="Guided tour" aria-live="polite">
    <div className="tdots" aria-hidden="true">${TOUR.map((_, i) => html`<span key=${i} className=${i === step ? "on" : i < step ? "done" : ""}></span>`)}</div>
    <small>Step ${step + 1} of ${TOUR.length}</small>
    <h3 tabIndex="-1" ref=${ref}>${t.title}</h3>
    <p>${t.text}</p>
    <div className="tbtns">
      <button type="button" className="tghost" onClick=${end}>End tour</button>
      <span>
        ${step > 0 && html`<button type="button" className="tghost" onClick=${() => setStep(step - 1)}>Back</button>`}
        <button type="button" className="tnext" onClick=${() => last ? end() : setStep(step + 1)}>${last ? "Finish" : "Next"}</button>
      </span>
    </div>
  </div>`;
}
